<script>
// <interpretar>
// Entiende frases en castellano o catalán como «examen de fluidos el jueves a las 10»
// o «sopar amb la Marta demà a les 21h». hoy: 'yyyy-mm-dd'.
// Devuelve { titulo, dia, diaFin, hora, fin, min, todoDia, tipo, tarea, lugar }: dia y hora quedan vacíos si la frase no los dice.
// Este bloque está copiado igual en Codigo.gs y en Panel.html (node sincronizar.js lo copia desde interpretar.js).
function interpretar(texto, hoy) {
  const orig = String(texto || '').replace(/[’`´]/g, "'").replace(/\s+/g, ' ').trim();
  // Copia en minúsculas y sin acentos con la misma longitud: así las posiciones sirven para recortar el título.
  const n = orig.split('').map(c => {
    const s = c.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    return s.length === 1 ? s : c;
  }).join('');
  const usado = new Array(n.length).fill(false);
  // Primera coincidencia que no pisa nada ya reconocido; la marca como usada.
  const tomar = re => {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(n))) {
      let libre = true;
      for (let i = m.index; i < m.index + m[0].length; i++) if (usado[i]) libre = false;
      if (libre && m[0]) {
        for (let i = m.index; i < m.index + m[0].length; i++) usado[i] = true;
        return m;
      }
      if (!m[0]) re.lastIndex++;
    }
    return null;
  };

  const r = { titulo: '', dia: '', diaFin: '', hora: '', fin: '', min: 0, todoDia: false, tipo: 'evento', tarea: false, lugar: '' };
  const [y0, m0, d0] = String(hoy).split('-').map(Number);
  const base = Date.UTC(y0, m0 - 1, d0);
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const mas = k => iso(base + k * 86400000);
  const dow = (new Date(base).getUTCDay() + 6) % 7; // 0 = lunes
  const dosCifras = x => String(x).padStart(2, '0');
  const fecha = (y, m, d) => {
    const t = Date.UTC(y, m - 1, d);
    const f = new Date(t);
    return f.getUTCMonth() === m - 1 && f.getUTCDate() === d ? iso(t) : '';
  };
  // Día y mes sin año: el próximo que llegue (si ya pasó este año, el año que viene).
  const proxima = (m, d) => {
    const f = fecha(y0, m, d);
    return f && f < hoy ? fecha(y0 + 1, m, d) : f;
  };

  // Tarea en vez de evento.
  if (tomar(/^(?:tareas?|tascas?|pendiente|recordar|recorda'm|recordatorio)\b[\s:,.-]*/g)) r.tarea = true;

  // Lugar al final: «… @ biblioteca».
  const lugar = tomar(/\s*@\s*(.+)$/g);
  if (lugar) r.lugar = orig.substr(lugar.index + lugar[0].indexOf('@') + 1).trim();

  if (tomar(/\b(?:todo el dia|tot el dia)\b/g)) r.todoDia = true;

  // Franja del día: sirve de hora si no se dice otra y para saber si «a las 5» es por la tarde.
  let franja = '';
  const fr = tomar(/\b(?:por la|de la|a la|per la|pel|al|esta|aquesta)\s+(manana|mati|tarde|tarda|noche|nit|mediodia|migdia)\b/g);
  if (fr) {
    franja = { manana: 'manana', mati: 'manana', tarde: 'tarde', tarda: 'tarde', noche: 'noche', nit: 'noche', mediodia: 'mediodia', migdia: 'mediodia' }[fr[1]];
    if (/^(esta|aquesta)\b/.test(fr[0])) r.dia = mas(0);
  }

  // Día.
  const rel = r.dia ? null : tomar(/\b(pasado manana|passat dema|dema passat|hoy|avui|manana|dema)\b/g);
  if (rel) {
    const w = rel[1];
    r.dia = /pasado|passat/.test(w) ? mas(2) : /manana|dema/.test(w) ? mas(1) : mas(0);
  }
  if (!r.dia) {
    const en = tomar(/\b(?:en|dentro de|d'aqui a|d'aqui|daqui a)\s+(\d{1,3})\s+(dias?|dies|semanas?|setmanes?)\b/g);
    if (en) r.dia = mas(Number(en[1]) * (/^s/.test(en[2]) ? 7 : 1));
  }
  const DIAS = ['lunes|dilluns', 'martes|dimarts', 'miercoles|dimecres', 'jueves|dijous', 'viernes|divendres', 'sabado|dissabte', 'domingo|diumenge'];
  if (!r.dia) {
    const sem = tomar(/\b(?:(?:el|este|aquest|el proximo|el proxim|proximo|proxim)\s+)?(lunes|martes|miercoles|jueves|viernes|sabado|domingo|dilluns|dimarts|dimecres|dijous|divendres|dissabte|diumenge)(?:\s+(que viene|que ve|vinent|proximo|proxim|de la semana que viene|de la setmana que ve))?\b/g);
    if (sem) {
      const idx = DIAS.findIndex(d => d.split('|').indexOf(sem[1]) >= 0);
      // «El jueves» dicho un jueves es el de la semana que viene.
      let delta = (idx - dow + 7) % 7 || 7;
      if (sem[2] && /semana|setmana/.test(sem[2]) && delta < 7 && idx >= dow) delta += 7;
      r.dia = mas(delta);
    }
  }
  const MESES = ['ene|gen', 'feb', 'mar', 'abr', 'may|mai', 'jun', 'jul', 'ago', 'sep|set', 'oct', 'nov', 'dic|des'];
  const numMes = w => MESES.findIndex(alts => alts.split('|').some(a => w.indexOf(a) === 0)) + 1;
  const MES_RE = '(enero|gener|febrero|febrer|marzo|marc|abril|mayo|maig|junio|juny|julio|juliol|agosto|agost|septiembre|setiembre|setembre|octubre|noviembre|novembre|diciembre|desembre|ene|feb|mar|abr|jun|jul|ago|sept|sep|set|oct|nov|dic|des)';
  // Varios días seguidos: «del 6 al 9 de diciembre» → todo el día, de ida a vuelta.
  if (!r.dia) {
    const dd = tomar(new RegExp("\\b(?:del|de|desde el|des del)\\s+(\\d{1,2})\\s+(?:al|a|hasta el|fins al)\\s+(\\d{1,2})\\s*(?:de\\s+|d'|del\\s+)?" + MES_RE + '\\b', 'g'));
    if (dd && Number(dd[1]) <= Number(dd[2])) {
      r.dia = proxima(numMes(dd[3]), Number(dd[1]));
      r.diaFin = r.dia ? fecha(Number(r.dia.slice(0, 4)), numMes(dd[3]), Number(dd[2])) : '';
      r.todoDia = !!r.diaFin;
    }
  }
  if (!r.dia) {
    const dm = tomar(/\b(?:el\s+)?(?:dia\s+)?(\d{1,2})\s*(?:de\s+|d'|del\s+)?(enero|gener|febrero|febrer|marzo|marc|abril|mayo|maig|junio|juny|julio|juliol|agosto|agost|septiembre|setiembre|setembre|octubre|noviembre|novembre|diciembre|desembre|ene|feb|mar|abr|jun|jul|ago|sept|sep|set|oct|nov|dic|des)\b\.?(?:\s+(?:de\s+|del\s+)?(\d{4}))?/g);
    if (dm) r.dia = dm[3] ? fecha(Number(dm[3]), numMes(dm[2]), Number(dm[1])) : proxima(numMes(dm[2]), Number(dm[1]));
  }

  // Horas: «10:30», «10.30», «10h», «10h30» o un número tras «a las».
  const NUM = '(\\d{1,2})(?:[:.](\\d{2})|h(\\d{2})?)?';
  const ART = "(?:(?:las?|les|l')\\s*)?";
  // Entrenar se hace temprano: «correr a las 6» son las 6 de la mañana.
  const madruga = /\b(entreno|entrenar|entrenament|correr|calistenia|movilidad|mobilitat|gimnasio|gym|running|rodaje)\b/.test(n);
  const minutos = (h, m, crudo) => {
    h = Number(h);
    m = Number(m || 0);
    if (h > 24 || m > 59) return null;
    // Sin «de la mañana», de 1 a 7 es por la tarde («a las 5» → 17:00), salvo que se escriba con cero delante.
    if (franja === 'manana' || /^0/.test(crudo)) return h * 60 + m;
    if ((franja === 'tarde' || franja === 'noche') && h < 12) h += 12;
    else if (!franja && h >= 1 && h <= 7 && !(madruga && h >= 5)) h += 12;
    return (h % 24) * 60 + m;
  };
  let ini = null;
  let fin = null;
  const rango = tomar(new RegExp('\\b(?:de|desde|des de|entre)\\s+' + ART + NUM + '\\s*(?:a|y|i|hasta|fins a|fins)\\s+' + ART + NUM + '(?:\\s*(?:h|horas|hores)\\b)?', 'g'))
    || tomar(new RegExp('\\b(\\d{1,2})(?:[:.](\\d{2})|h(\\d{2})?)\\s*-\\s*' + NUM + '\\b', 'g'));
  if (rango) {
    ini = minutos(rango[1], rango[2] || rango[3], rango[1]);
    fin = minutos(rango[4], rango[5] || rango[6], rango[4]);
    if (ini != null && fin != null && fin <= ini && fin + 720 > ini) fin += 720;
  }
  if (ini == null) {
    const t = tomar(new RegExp('\\b(?:a|sobre|cap a|hacia|at)\\s+' + ART + NUM + '(?:\\s*(?:h|horas|hores)\\b)?', 'g'));
    if (t) ini = minutos(t[1], t[2] || t[3], t[1]);
  }
  // Duración: «2 horas», «durante 1h30», «45 min».
  let dur = 0;
  const d1 = tomar(/\b(?:durante|durant|por|per)\s+(\d+(?:[.,]\d+)?)\s*(?:h(\d{2})?|horas?|hores?|min|minutos?|minuts?)\b/g)
    || tomar(/\b(\d+(?:[.,]\d+)?)\s*(?:horas?|hores?|min|minutos?|minuts?)\b/g);
  if (d1) {
    const v = Number(d1[1].replace(',', '.'));
    dur = /min/.test(d1[0]) ? v : v * 60 + Number(d1[2] || 0);
  }
  if (ini == null) {
    // «10h», «10:30» o «10.30» sueltos. Un «2h» suelto (de 1 a 5) se entiende como duración.
    const t = tomar(/\b(\d{1,2})(?:[:.](\d{2})|h(\d{2})?)(?![\d/-])/g);
    if (t) {
      if (!t[2] && !t[3] && Number(t[1]) <= 5 && !dur) dur = Number(t[1]) * 60;
      else ini = minutos(t[1], t[2] || t[3], t[1]);
    }
  }
  if (!dur) {
    const d2 = tomar(/\b(\d)h(\d{2})\b/g);
    if (d2) dur = Number(d2[1]) * 60 + Number(d2[2]);
  }

  // Fechas con números, después de las horas para no confundir «10.30» con una fecha.
  if (!r.dia) {
    const num = tomar(/\b(?:el\s+)?(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2,4}))?\b/g);
    if (num) {
      const y = num[3] ? Number(num[3].length === 2 ? '20' + num[3] : num[3]) : 0;
      r.dia = y ? fecha(y, Number(num[2]), Number(num[1])) : proxima(Number(num[2]), Number(num[1]));
    }
  }
  if (!r.dia) {
    const sol = tomar(/\b(?:el|dia|el dia)\s+(\d{1,2})\b(?!\s*(?:h\b|:|horas|hores|min))/g);
    if (sol) {
      const d = Number(sol[1]);
      let f = fecha(y0, m0, d);
      if (!f || f < hoy) f = m0 === 12 ? fecha(y0 + 1, 1, d) : fecha(y0, m0 + 1, d);
      r.dia = f;
    }
  }

  if (ini == null && franja && !r.todoDia) ini = { manana: 540, mediodia: 840, tarde: 1020, noche: 1260 }[franja];

  // Tipo por palabras clave (el orden importa: «entregar práctica» es una entrega, no una clase).
  const TIPOS = [
    ['estudio', /\b(estudiar|estudio|estudi|repasar|repaso|repassar|repas|sesion de estudio)\b/],
    ['viaje', /\b(viaje|viatge|escapada|salida|sortida|excursion|excursio|acampada|campaments?|colonias|colonies)\b/],
    ['entreno', /\b(entreno|entrenar|entrenament|gimnasio|gym|correr|corriendo|calistenia|movilidad|mobilitat|running|rodaje|series)\b/],
    ['examen', /\b(examen|examenes|examens|exam|parcial|parcials|final de|prueba|control|test|recuperacion|recuperacio)\b/],
    ['entrega', /\b(entrega|entregas|entregar|lliurament|lliurar|deadline|fecha limite|data limit)\b/],
    ['clase', /\b(clase|clases|classe|classes|teoria|practicas?|laboratorio|lab|seminario|seminari|tutoria)\b/],
    ['cita', /\b(medico|metge|dentista|cita|consulta|fisio|peluqueria|perruqueria|barbero|revision|revisio|banco|banc|entrevista)\b/],
    ['plan', /\b(cena|sopar|comida|dinar|quedada|quedar|fiesta|festa|cumple|cumpleanos|aniversari|cine|cinema|concierto|concert|partido|partit|birras?|cafe)\b/],
  ];
  const tipo = TIPOS.find(t => t[1].test(n));
  if (tipo) r.tipo = tipo[0];

  if (ini != null) {
    r.hora = dosCifras(Math.floor(ini / 60)) + ':' + dosCifras(ini % 60);
    r.min = fin != null ? fin - ini : dur || ({ examen: 120, plan: 120, estudio: 50 }[r.tipo] || 60);
    const f = ini + r.min;
    r.fin = dosCifras(Math.floor(f / 60) % 24) + ':' + dosCifras(f % 60);
  } else {
    r.min = dur;
    if (!r.tarea) r.todoDia = true;
  }

  // Título: lo que queda sin reconocer, sin palabras sueltas en los bordes.
  let t = orig.split('').map((c, i) => usado[i] ? ' ' : c).join('').replace(/\s+/g, ' ').trim();
  const SUELTAS = "el|la|los|las|lo|de|del|a|al|en|y|i|e|amb|con|para|per|que|les|l'|d'|por|este|esta|aquest|aquesta|sobre|hacia|cap|durante|durant|desde|des|hasta|fins";
  const borde = new RegExp('^(?:(?:' + SUELTAS + ")(?:\\s+|$)|[,.;:\\-–])+|(?:\\s+(?:" + SUELTAS + ')|\\s*[,.;:\\-–])+$', 'i');
  for (let i = 0; i < 4; i++) t = t.replace(borde, '').trim();
  r.titulo = t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
  return r;
}
// </interpretar>
</script>
<script>
  // Servidor de Google con el que habla la web propia (en GitHub). Cada persona tiene el suyo:
  // llega como ?api=ID la primera vez y se recuerda.
  const API = leerApi();
  const EN_GOOGLE = !!(window.google && google.script && google.script.run);
  const K = leerClave();
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DIAS = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const COLOR = {
    estudio: '#c3a2ff', examen: '#ff6b5e', entrega: '#ffc247', clase: '#5aa2ff', entreno: '#ff9f43', trabajo: '#6c6c73',
    cau: '#3fd69b', viaje: '#4dd0e1', cita: '#ff8fc7', plan: '#a3e635', evento: '#9a9aa1', festivo: '#9a9aa1',
  };
  const NOMBRE = {
    estudio: 'Estudio', examen: 'Examen', entrega: 'Entrega', clase: 'Clase', entreno: 'Entreno', trabajo: 'Trabajo',
    cau: 'Cau', viaje: 'Viaje', cita: 'Cita', plan: 'Plan', evento: 'Evento', festivo: 'Festivo',
  };
  const SEMAFORO = { '': '#3a3a40', rojo: '#ff6b5e', ambar: '#ffc247', verde: '#3fd69b' };
  const SIGUIENTE_ESTADO = { '': 'rojo', rojo: 'ambar', ambar: 'verde', verde: '' };
  const OK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
  const X = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const TRABAJO_MS = 50 * 60000, CICLO_MS = 60 * 60000;

  let D = null;
  let tab = 'today';
  let abierto = '';       // examen desplegado en Exams
  let cargadoEn = 0;
  let hoja = '';          // qué hoja está abierta: '', 'foco', 'tarjetas', 'otra'
  try { tab = localStorage.getItem('plum.tab') || 'today'; } catch (e) {}
  if (!['today', 'exams', 'week', 'tasks'].includes(tab)) tab = 'today';

  // ---------- Servidor ----------

  function leerApi() {
    const q = new URLSearchParams(location.search).get('api');
    let id = q && /^[\w-]{20,}$/.test(q) ? q : '';
    if (id) {
      try { localStorage.setItem('plum.api', id); } catch (e) {}
    } else {
      try { id = localStorage.getItem('plum.api') || ''; } catch (e) {}
    }
    return id ? 'https://script.google.com/macros/s/' + id + '/exec' : '';
  }

  // Dentro de Google la clave llega en la página; en la web propia, por ?k= la primera vez y luego se recuerda.
  function leerClave() {
    const dk = document.body.dataset.k || '';
    if (/^[\w-]{4,}$/.test(dk)) return dk;
    const q = new URLSearchParams(location.search).get('k');
    // La dirección se queda con ?api y ?k: la app de la pantalla de inicio del iPhone no comparte memoria con Safari.
    if (q) {
      try { localStorage.setItem('plum.k', q); } catch (e) {}
      return q;
    }
    try { return localStorage.getItem('plum.k') || ''; } catch (e) { return ''; }
  }

  function run(fn, ...args) {
    if (EN_GOOGLE) {
      return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](K, ...args));
    }
    return llamarApi(fn, args);
  }

  // text/plain evita la comprobación previa del navegador, que el servidor de Google no contesta.
  async function llamarApi(fn, args) {
    const r = fn === 'datos'
      ? await fetch(API + '?accion=datos&k=' + encodeURIComponent(K))
      : await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ api: fn, k: K, que: args[0], d: args[1] }),
        });
    let j;
    try { j = await r.json(); } catch (e) { throw new Error('El servidor no ha contestado bien, prueba otra vez'); }
    if (j && j.error) throw new Error(j.error);
    return j;
  }

  function cargando(si) { $('carga').classList.toggle('ver', si); }

  async function cargar() {
    cargando(true);
    try {
      D = await run('datos');
      cargadoEn = Date.now();
      guardarCache(D);
      refrescar();
    } catch (e) {
      if (/clave/i.test(e.message) && !EN_GOOGLE) pantallaClave(e.message);
      else if (!D) pantallaError(e.message);
      else avisar('Sin conexión: ' + e.message);
    }
    cargando(false);
  }

  // Escribir: el servidor contesta con los datos ya actualizados.
  async function hacer(que, d, boton) {
    if (boton) boton.disabled = true;
    cargando(true);
    try {
      const r = await run('accion', que, d);
      D = r.datos;
      cargadoEn = Date.now();
      guardarCache(D);
      cerrarHoja();
      pintar();
      if (r.msg) avisar(r.msg.replace(/^✅\s*/, ''));
      return true;
    } catch (e) {
      avisar(e.message);
      if (boton) boton.disabled = false;
      return false;
    } finally {
      cargando(false);
    }
  }

  // Toques rápidos (pasos, tarjetas, hábitos, temario): la pantalla cambia al momento y se envía detrás, en orden.
  let cola = Promise.resolve();
  function silencioso(que, d) {
    cola = cola.then(() => run('accion', que, d)).then(r => {
      D = r.datos;
      cargadoEn = Date.now();
      guardarCache(D);
      refrescar();
    }).catch(e => avisar('No se ha guardado: ' + e.message));
  }

  function guardarCache(d) {
    try { localStorage.setItem('plum.cache', JSON.stringify(d)); } catch (e) {}
  }
  function leerCache() {
    try { return JSON.parse(localStorage.getItem('plum.cache') || 'null'); } catch (e) { return null; }
  }

  function pantallaClave(error) {
    $('nav').hidden = true;
    $('mas').hidden = true;
    $('titulo').textContent = 'Plum';
    $('sub').textContent = '';
    if (!API && !EN_GOOGLE) {
      $('vista').innerHTML = `<section class="tip"><b>Falta conectar tu calendario</b>
        <p class="nota">Abre Plum con el enlace o el código QR que te dio tu servidor de Google (la dirección que acaba en /exec). Solo hace falta la primera vez.</p></section>`;
      return;
    }
    $('vista').innerHTML = `<form class="tip" id="formClave" autocomplete="off">
        <p class="nota">${error ? esc(error) + '. ' : ''}Escribe tu clave para entrar (solo la primera vez).</p>
        <input class="campo" name="clave" placeholder="Clave" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="btn">Entrar</button>
      </form>`;
    $('formClave').onsubmit = e => {
      e.preventDefault();
      const c = new FormData(e.target).get('clave').trim();
      if (c) location.href = location.pathname + '?k=' + encodeURIComponent(c);
    };
  }

  function pantallaError(msg) {
    $('vista').innerHTML = `<section class="tip"><b>No he podido abrir tu calendario</b><p class="nota">${esc(msg)}</p>
      <button class="btn" data-act="reintentar">Reintentar</button></section>`;
  }

  // ---------- Utilidades ----------

  function avisar(t) {
    const x = $('toast');
    x.textContent = t;
    x.classList.add('ver');
    clearTimeout(avisar.t);
    avisar.t = setTimeout(() => x.classList.remove('ver'), 3000);
  }

  const diaMas = (dia, n) => {
    const [y, m, d] = dia.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  };
  const diaSemana = dia => { const [y, m, d] = dia.split('-').map(Number); return (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7; };
  const fecha = dia => DIAS[diaSemana(dia)] + ' ' + Number(dia.slice(8)) + ' ' + MESES[Number(dia.slice(5, 7)) - 1];
  const fin = e => e.t + e.min * 60000;
  const horas = min => { const h = Math.round(min / 6) / 10; return String(h).replace('.', ',') + ' h'; };
  const hoyLocal = () => { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); };
  const cuantoFalta = t => {
    const m = Math.round((t - Date.now()) / 60000);
    if (m < 60) return 'en ' + Math.max(1, m) + ' min';
    const h = Math.floor(m / 60), r = m % 60;
    return 'en ' + h + ' h' + (r ? ' ' + r : '');
  };
  const pasosDe = e => String(e.desc || '').split('\n').map(l => l.trim()).filter(Boolean);
  const hechosDe = e => String(e.pasos || '').split(',').filter(x => x !== '').map(Number);
  // Un evento se identifica por id + calendario + inicio (los de una serie comparten id).
  const clave = e => e.id + '|' + e.t;
  const buscar = k => D.eventos.find(e => clave(e) === k);
  const ref = e => ({ id: e.id, cal: e.cal, t: e.t });
  // Con la etiqueta de la asignatura delante, el título no la repite («STE · 1er control» → «1er control»).
  const sinAsig = e => e.asig && e.titulo.indexOf(e.asig + ' · ') === 0 ? e.titulo.slice(e.asig.length + 3) : e.titulo;
  const esSimulacro = e => e.tipo === 'estudio' && /simulacro/i.test(e.titulo) && !/correcci/i.test(e.titulo);
  const atraso = ex => Math.max(0, (ex.minPrevistos || 0) - (ex.minHechos || 0));
  const examenPrincipal = () => { const exs = D.examenes.filter(x => x.tipo === 'examen'); return exs.find(x => x.minTotal) || exs[0]; };

  // ---------- Pantallas ----------

  function refrescar() {
    if (!D) return;
    if (hoja === 'foco') pintarFoco();
    else if (hoja === 'tarjetas') pintarTarjeta();
    if (!hoja || hoja === 'foco' || hoja === 'tarjetas') pintar();
  }

  function pintar() {
    if (!D) return;
    $('nav').hidden = false;
    $('mas').hidden = false;
    document.querySelectorAll('[data-tab]').forEach(b => b.toggleAttribute('aria-current', b.dataset.tab === tab));
    const hoy = hoyLocal();
    const enfoque = document.activeElement && document.activeElement.id;
    const texto = enfoque && $(enfoque) && $(enfoque).value;
    if (tab === 'today') {
      $('titulo').textContent = 'Today';
      $('sub').textContent = fecha(hoy);
      $('vista').innerHTML = vistaHoy(hoy);
    } else if (tab === 'exams') {
      const n = D.examenes.length;
      $('titulo').textContent = 'Exams';
      $('sub').textContent = n ? n + ' a la vista' : '';
      $('vista').innerHTML = vistaExamenes();
    } else if (tab === 'week') {
      $('titulo').textContent = 'Week';
      $('sub').textContent = D.semana ? Number(D.semana.lunes.slice(8)) + '–' + fecha(D.semana.domingo).replace(/^\S+ /, '') : '';
      $('vista').innerHTML = vistaSemana(hoy);
    } else {
      const pend = D.tareas.filter(t => !t.hecha).length;
      $('titulo').textContent = 'Tasks';
      $('sub').textContent = pend ? pend + (pend === 1 ? ' pendiente' : ' pendientes') : '';
      $('vista').innerHTML = vistaTareas(hoy);
    }
    // Si se estaba escribiendo, se conserva lo escrito y el foco.
    if (enfoque && $(enfoque) && texto != null && !$(enfoque).value) { $(enfoque).value = texto; $(enfoque).focus(); }
    const i = $('rapido');
    if (i) i.oninput = () => previa(i.value, $('previa'));
    const t = $('nuevaTarea');
    if (t) t.oninput = () => previa(t.value, $('previaTarea'), true);
  }

  function listaPasos(e, editable) {
    const pasos = pasosDe(e);
    if (!pasos.length) return '';
    const hechos = hechosDe(e);
    return `<ul class="pasos">${pasos.map((p, i) => {
      const ok = hechos.includes(i) || e.estado === 'hecha';
      return `<li><button ${editable ? `data-act="paso" data-ev="${esc(clave(e))}" data-i="${i}"` : 'disabled'} class="${ok ? 'ok' : ''}" aria-pressed="${ok}"><i>${ok ? OK : ''}</i><span>${esc(p)}</span></button></li>`;
    }).join('')}</ul>`;
  }

  function vistaHoy(hoy) {
    const ahora = Date.now();
    const ayer = diaMas(hoy, -1);
    const manana = diaMas(hoy, 1);
    const delDia = D.eventos.filter(e => e.dia <= hoy && e.diaFin >= hoy);
    const conHora = delDia.filter(e => !e.todoDia);
    const enteros = delDia.filter(e => e.todoDia);
    const actual = conHora.filter(e => e.t <= ahora && fin(e) > ahora).sort((a, b) => (a.tipo === 'trabajo') - (b.tipo === 'trabajo'))[0];
    const siguiente = conHora.find(e => e.t > ahora);
    const deManana = D.eventos.filter(e => e.dia === manana && !e.todoDia);
    let html = '';

    // Lo que toca ahora o lo siguiente, con su «cómo».
    const heroe = actual || siguiente || deManana[0];
    if (heroe) {
      const cuando = heroe === actual ? 'Ahora · hasta ' + heroe.horaFin : heroe === siguiente ? 'Siguiente · ' + cuantoFalta(heroe.t) : 'Mañana · ' + heroe.hora;
      const estudio = heroe.tipo === 'estudio';
      const k = esc(clave(heroe));
      let botones = '';
      if (estudio && heroe.estado !== 'hecha') {
        botones = esSimulacro(heroe)
          ? `<div class="fila"><a class="btn" href="${esc(enlaceSimulacro(heroe))}" target="_blank" rel="noopener">Abrir el simulacro en Claude</a>
              <button class="btn sec" data-act="notaSim" data-ev="${k}">Poner nota</button></div>`
          : `<div class="fila"><button class="btn" data-act="foco" data-ev="${k}">Empezar</button>
              <button class="btn sec" data-act="terminar" data-ev="${k}">Hecha</button>
              <button class="btn sec" data-act="recolocar" data-ev="${k}">Muévela</button></div>`;
      } else if (heroe.tangerine) {
        botones = `<div class="fila"><a class="btn" href="${esc(D.tangerine)}" target="_blank" rel="noopener">Abrir Tangerine</a></div>`;
      }
      const cau = heroe.tipo === 'cau' ? D.tareas.filter(t => t.lista === 'cau' && !t.hecha && t.dia === heroe.dia) : [];
      html += `<article class="ahora ${estudio ? '' : 'otro'}">
          <span class="eti">${cuando}</span>
          <h2>${esc(heroe.titulo)}</h2>
          <p>${heroe.hora}–${heroe.horaFin}${heroe.lugar ? ' · ' + esc(heroe.lugar) : ''}</p>
          ${estudio ? listaPasos(heroe, heroe.estado !== 'hecha') : heroe.desc ? `<p class="como">${esc(heroe.desc)}</p>` : ''}
          ${cau.length ? `<p class="como">Para preparar: ${cau.map(t => esc(t.titulo)).join(' · ')}</p>` : ''}
          ${botones}
          ${estudio && heroe.estado === 'hecha' ? `<p>✓ Hecha${heroe.nota ? ' · ' + heroe.nota + '/5' : ''}${heroe.simulacro != null ? ' · ' + String(heroe.simulacro).replace('.', ',') + '/10' : ''}</p>` : ''}
        </article>`;
      if (heroe === actual && siguiente) html += `<p class="despues">Después: ${siguiente.hora} ${esc(siguiente.titulo)}</p>`;
    } else {
      html += `<article class="ahora otro"><span class="eti">Hoy</span><h2>Nada más en el calendario</h2></article>`;
    }

    // Sesiones de estudio que ya pasaron sin marcar.
    const pend = D.eventos.filter(e => e.tipo === 'estudio' && e.estado !== 'hecha' && !e.todoDia && fin(e) <= ahora && e.dia >= ayer && e !== heroe);
    pend.slice(0, 2).forEach(e => {
      html += `<section class="tip"><p>¿Hiciste <b>${esc(e.titulo)}</b>? <span class="nota">(${e.dia === hoy ? 'hoy' : 'ayer'} ${e.hora})</span></p>
        <div class="fila"><button class="btn" data-act="terminar" data-ev="${esc(clave(e))}">Sí, hecha</button>
        <button class="btn sec" data-act="recolocar" data-ev="${esc(clave(e))}">No, muévela</button></div></section>`;
    });

    // Los exámenes de las dos próximas semanas (o el más cercano), con aviso si vas atrasado.
    const exs = D.examenes.filter(x => x.tipo === 'examen');
    const cerca = exs.filter(x => x.faltan <= 14).slice(0, 3);
    (cerca.length ? cerca : exs.slice(0, 1)).forEach(ex => {
      html += tarjetaExamen(ex);
    });

    // Hábitos de hoy.
    if (D.habitos && D.habitos.length) {
      html += `<section class="habitos" aria-label="Hábitos de hoy">${D.habitos.map(h => `<button class="habito ${h.hoy ? 'ok' : ''}" data-act="habito" data-id="${esc(h.id)}" aria-pressed="${h.hoy}">
          <i>${h.hoy ? OK : ''}</i><span>${esc(h.nombre)}</span>${h.racha ? `<small>${h.racha} ${h.racha === 1 ? 'día' : 'días'}</small>` : ''}</button>`).join('')}</section>`;
    }

    // Tarjetas para repasar (sobre todo en el tren).
    const nT = D.tarjetas ? D.tarjetas.hoy.length : 0;
    if (nT) {
      const tren = [actual, siguiente].some(e => e && e.tipo === 'clase');
      html += `<button class="meta tarjetas-btn" data-act="tarjetas">
          <span class="n" style="color:var(--plum)">${nT}</span>
          <b>${tren ? 'Tarjetas para el tren' : 'Tarjetas para repasar'}</b>
          <span class="nota">Fórmulas de memoria · unos ${Math.max(2, Math.round(nT / 4))} min</span>
        </button>`;
    }

    // El día.
    if (enteros.length) {
      html += `<div class="pastillas">${enteros.map(e => `<button class="pastilla" data-act="ver" data-ev="${esc(clave(e))}"><i style="background:${COLOR[e.tipo] || COLOR.evento}"></i><span>${esc(e.titulo)}${e.diaFin > e.dia ? ' · hasta ' + fecha(e.diaFin) : ''}</span></button>`).join('')}</div>`;
    }
    if (conHora.length) {
      let linea = false;
      const items = [];
      conHora.forEach(e => {
        if (!linea && e.t > ahora) {
          items.push(`<li class="linea"><span>${new Date().toTimeString().slice(0, 5)}</span></li>`);
          linea = true;
        }
        items.push(filaEvento(e, fin(e) <= ahora));
      });
      if (!linea) items.push(`<li class="linea"><span>${new Date().toTimeString().slice(0, 5)}</span></li>`);
      html += `<section><span class="eti">Hoy</span><ol class="dia">${items.join('')}</ol></section>`;
    }

    // Tareas para hoy o atrasadas.
    const tareas = D.tareas.filter(t => !t.hecha && t.dia && t.dia <= hoy);
    if (tareas.length) html += `<section class="grupo"><span class="eti">Tareas</span>${tareas.map(t => filaTarea(t, hoy)).join('')}</section>`;

    // Mañana.
    if (deManana.length) {
      html += `<section><span class="eti">Mañana · ${fecha(manana)}</span><ol class="dia compacta">${deManana.slice(0, 8).map(e => filaEvento(e, false)).join('')}</ol></section>`;
    }

    html += `<form class="rapido" data-form="rapido"><input id="rapido" placeholder="Apunta algo: «estudiar STE el lunes a las 4»" aria-label="Apuntar un evento" autocomplete="off" enterkeyhint="send"><button aria-label="Apuntar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></form>
      <p class="previa" id="previa"></p>`;
    return html;
  }

  function tarjetaExamen(ex) {
    const debe = atraso(ex);
    return `<div class="meta-grupo"><button class="meta" data-tab="exams">
        <span class="n" style="color:${COLOR.examen}">${ex.faltan}<small>${ex.faltan === 1 ? 'día' : 'días'}</small></span>
        <b>${ex.asig ? `<span class="asig">${esc(ex.asig)}</span>` : ''}${esc(sinAsig(ex))}</b>
        ${ex.minTotal ? `<div class="barra"><span><em style="width:${Math.min(100, ex.minHechos / ex.minTotal * 100)}%"></em></span>${horas(ex.minHechos)} de ${horas(ex.minTotal)}</div>` : `<span class="nota">${fecha(ex.dia)}${ex.hora ? ' · ' + ex.hora : ''}</span>`}
      </button>
      ${debe >= 60 && ex.asig ? `<div class="atraso"><span>Vas <b>${horas(debe)}</b> por detrás de lo previsto.</span><button class="btn peq" data-act="extra" data-asig="${esc(ex.asig)}">Añadir 1 h</button></div>` : ''}</div>`;
  }

  function filaEvento(e, pasado) {
    const sub = e.tipo === 'estudio' || e.tangerine ? pasosDe(e)[0] || '' : e.lugar;
    return `<li><button class="${pasado ? 'pasado' : ''} ${e.tipo === 'estudio' ? 'estudio' : ''}" data-act="ver" data-ev="${esc(clave(e))}">
        <time>${e.hora}</time><i style="background:${COLOR[e.tipo] || COLOR.evento}"></i>
        <span style="min-width:0"><b>${esc(e.titulo)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>
        <span class="ok">${e.estado === 'hecha' ? OK : ''}</span></button></li>`;
  }

  function vistaExamenes() {
    if (!D.examenes.length) {
      return `<p class="vacio">No hay exámenes ni entregas a la vista.</p>
        <button class="btn ancho sec" data-act="nuevo" data-modo="examen">+ Examen o entrega</button>`;
    }
    return `<div class="examenes">${D.examenes.map(e => {
      const k = e.id + '|' + e.t;
      const color = COLOR[e.tipo];
      const sin = e.tipo === 'examen' && e.asig && !e.minTotal;
      const temario = D.temario.filter(a => a.examen === e.titulo);
      const debe = atraso(e);
      const abiertoYa = abierto === k;
      let detalle = '';
      if (abiertoYa) {
        if (temario.length) {
          const n = c => temario.filter(a => a.estado === c).length;
          detalle += `<div class="bloque"><span class="eti">Temario · ${n('verde')} verde, ${n('ambar')} ámbar, ${n('rojo')} rojo</span>
            <ul class="temario">${temario.map(a => `<li><button data-act="apartado" data-id="${esc(a.id)}" aria-label="${esc(a.apartado)}: ${a.estado || 'sin marcar'}">
              <i style="background:${SEMAFORO[a.estado]}"></i><span class="num">${esc(a.apartado)}</span><span>${esc(a.titulo)}</span></button></li>`).join('')}</ul>
            <p class="nota">Toca un apartado: rojo (no lo sé) → ámbar (más o menos) → verde (dominado).</p></div>`;
        }
        if (e.simulacros && e.simulacros.length) {
          detalle += `<div class="bloque"><span class="eti">Simulacros</span><p>${e.simulacros.map(s => fecha(s.dia) + ': <b>' + String(s.nota).replace('.', ',') + '</b>').join(' · ')}</p></div>`;
        }
        if (e.sesiones.length) {
          detalle += `<div class="bloque"><span class="eti">Sesiones</span><ul class="sesiones">${e.sesiones.map(s => `<li>
              <span class="${s.hecha ? 'si' : s.pasada ? 'no' : ''}">${s.hecha ? '✓' : s.pasada ? '!' : '·'}</span>
              <span>${fecha(s.dia)} ${s.hora}</span><em>${esc(sinAsig({ asig: e.asig, titulo: s.titulo }))}${s.nota ? ' · ' + s.nota + '/5' : ''}</em></li>`).join('')}</ul></div>`;
        }
        if (e.asig && D.tarjetas.hoy.some(t => t.asig === e.asig)) detalle += `<button class="btn sec" data-act="tarjetas" data-asig="${esc(e.asig)}">Repasar tarjetas de ${esc(e.asig)}</button>`;
        if (e.desc) detalle += `<p class="como">${esc(e.desc)}</p>`;
      }
      return `<article class="ex">
          <button class="ex-cab" data-act="abrir" data-k="${esc(k)}" aria-expanded="${abiertoYa}">
            <div class="n" style="color:${color}">${e.faltan}<small>${e.faltan === 1 ? 'día' : 'días'}</small></div>
            <b>${e.asig ? `<span class="asig">${esc(e.asig)}</span>` : ''}${esc(sinAsig(e))}</b>
            <span class="cuando">${fecha(e.dia)}${e.hora ? ' · ' + (e.tipo === 'entrega' ? 'hasta las ' : '') + e.hora : ''}${e.lugar ? ' · ' + esc(e.lugar) : ''}</span>
            ${e.minTotal ? `<div class="barra"><span><em style="width:${Math.min(100, e.minHechos / e.minTotal * 100)}%"></em></span>${horas(e.minHechos)} de ${horas(e.minTotal)}</div>` : ''}
            ${e.prox ? `<div class="prox">Próxima: ${fecha(e.prox.dia)} · ${e.prox.hora}</div>` : sin ? `<div class="prox falta">Sin sesiones de estudio todavía</div>` : ''}
          </button>
          ${debe >= 60 && e.asig ? `<div class="atraso"><span>Vas <b>${horas(debe)}</b> por detrás.</span><button class="btn peq" data-act="extra" data-asig="${esc(e.asig)}">Añadir 1 h</button></div>` : ''}
          ${detalle}
        </article>`;
    }).join('')}</div>
      <button class="btn ancho sec" data-act="nuevo" data-modo="examen">+ Examen o entrega</button>`;
  }

  function vistaSemana(hoy) {
    const s = D.semana;
    if (!s) return '<p class="vacio">Cargando la semana…</p>';
    const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
    const est = pct(s.estudio.hecho, s.estudio.previsto);
    let html = `<section class="resumen">
        <div class="aro" style="--p:${est}"><span><b>${est}%</b><small>estudio</small></span></div>
        <div class="cifras">
          <p><b>${horas(s.estudio.hecho)}</b> de ${horas(s.estudio.previsto)} estudiadas</p>
          <p><b>${s.estudio.hechas}</b> de ${s.estudio.sesiones} sesiones</p>
          ${s.entrenos.previstos ? `<p><b>${s.entrenos.hechos}</b> de ${s.entrenos.previstos} entrenos</p>` : '<p class="nota">Entrenos: con Tangerine</p>'}
          ${s.habitos.posibles ? `<p><b>${pct(s.habitos.marcas, s.habitos.posibles)}%</b> de hábitos</p>` : ''}
        </div></section>`;
    if (s.porAsig.length) {
      html += `<section class="bloque"><span class="eti">Por asignatura</span>${s.porAsig.map(a => `<div class="fila-asig"><span class="asig">${esc(a.asig)}</span>
          <div class="barra"><span><em style="width:${pct(a.hecho, a.previsto)}%"></em></span>${horas(a.hecho)} de ${horas(a.previsto)}</div></div>`).join('')}</section>`;
    }
    if (s.sinHacer.length) {
      html += `<section class="bloque"><span class="eti">Sin hacer esta semana</span>${s.sinHacer.map(e => {
        const ev = D.eventos.find(x => x.id === e.id && x.t === e.t);
        return `<div class="fila-sin"><span><b>${esc(e.titulo)}</b><small>${fecha(e.dia)} · ${e.hora}</small></span>
          ${ev ? `<button class="btn peq sec" data-act="recolocar" data-ev="${esc(clave(ev))}">Muévela</button>` : ''}</div>`;
      }).join('')}</section>`;
    } else if (s.estudio.sesiones) {
      html += `<p class="nota">Nada pendiente de los días que ya han pasado.</p>`;
    }
    if (s.proxima.length) {
      html += `<section class="bloque"><span class="eti">La semana que viene</span><p>${s.proxima.map(p => `<span class="asig">${esc(p.asig)}</span>${horas(p.min)}`).join(' &nbsp; ')}</p></section>`;
    }
    // Hábitos: los últimos 14 días y su racha.
    html += `<section class="bloque"><span class="eti">Hábitos · últimos 14 días</span>${D.habitos.map(h => `<div class="fila-hab">
        <span><b>${esc(h.nombre)}</b><small>${h.racha ? 'Racha de ' + h.racha + (h.racha === 1 ? ' día' : ' días') : 'Sin racha'}</small></span>
        <span class="puntos">${h.ultimos.map((x, i) => `<i class="${x ? 'si' : ''} ${i === 13 ? 'hoy' : ''}"></i>`).join('')}</span>
        <button class="quitar" data-act="habitoBorrar" data-id="${esc(h.id)}" aria-label="Quitar ${esc(h.nombre)}">${X}</button></div>`).join('')}
      <form class="rapido" data-form="habito"><input id="nuevoHabito" placeholder="Nuevo hábito: «leer 15 min»" aria-label="Nuevo hábito" autocomplete="off"><button aria-label="Añadir hábito"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></form></section>`;
    html += `<button class="btn ancho sec" data-act="conexiones">Atenea, widget, Siri y avisos</button>`;
    return html;
  }

  function filaTarea(t, hoy) {
    let nota = '';
    if (!t.hecha && t.dia) nota = t.dia < hoy ? `<small class="vencida">Era para el ${fecha(t.dia)}</small>` : t.dia === hoy ? '' : `<small>${fecha(t.dia)}</small>`;
    return `<div class="tarea ${t.hecha ? 'ok' : ''}"><button data-act="tarea" data-id="${esc(t.id)}"><span class="c">${t.hecha ? OK : ''}</span><span><b>${esc(t.titulo)}</b>${nota}</span></button>
      <button class="quitar" data-act="borrarTarea" data-id="${esc(t.id)}" aria-label="Borrar tarea">${X}</button></div>`;
  }

  function vistaTareas(hoy) {
    const normales = D.tareas.filter(t => t.lista !== 'cau');
    const cau = D.tareas.filter(t => t.lista === 'cau' && !t.hecha);
    const grupos = [
      ['Atrasadas', t => !t.hecha && t.dia && t.dia < hoy],
      ['Hoy', t => !t.hecha && t.dia === hoy],
      ['Próximas', t => !t.hecha && t.dia > hoy],
      ['Sin fecha', t => !t.hecha && !t.dia],
      ['Hechas', t => t.hecha],
    ];
    let html = `<form class="rapido" data-form="tarea"><input id="nuevaTarea" placeholder="Nueva tarea: «imprimir apuntes el lunes»" aria-label="Nueva tarea" autocomplete="off" enterkeyhint="done"><button aria-label="Añadir tarea"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></form>
      <p class="previa" id="previaTarea"></p>`;
    let alguna = false;
    grupos.forEach(([nombre, f]) => {
      const lista = normales.filter(f);
      if (!lista.length) return;
      alguna = true;
      html += `<section class="grupo"><span class="eti">${nombre}</span>${lista.map(t => filaTarea(t, hoy)).join('')}</section>`;
    });
    // El cau, por sábado o salida.
    const dias = [...new Set(cau.map(t => t.dia || ''))].sort();
    dias.forEach(d => {
      alguna = true;
      html += `<section class="grupo cau"><span class="eti">Cau${d ? ' · ' + fecha(d) : ''}</span>${cau.filter(t => (t.dia || '') === d).map(t => filaTarea(t, hoy)).join('')}</section>`;
    });
    if (!alguna) html += '<p class="vacio">Nada pendiente.</p>';
    html += `<p class="nota">Empieza por «cau» («cau comprar cartulinas») y va a la lista del sábado.</p>`;
    return html;
  }

  // Lo que se va a apuntar, mientras se escribe.
  function previa(texto, donde, comoTarea) {
    if (!donde) return;
    if (!texto.trim()) { donde.innerHTML = ''; return; }
    const r = interpretar(texto, hoyLocal());
    if (!r.titulo) { donde.innerHTML = ''; return; }
    if (comoTarea || r.tarea) {
      const cau = /^(cau|agrupament)\b/i.test(r.titulo);
      donde.innerHTML = `${cau ? 'Para el cau' : 'Tarea'} <b>${esc(r.titulo.replace(/^(cau|agrupament)\b[\s:,.-]*/i, ''))}</b>${r.dia ? ' · ' + fecha(r.dia) : cau ? ' · el sábado' : ''}`;
      return;
    }
    const dia = r.dia || hoyLocal();
    const cuando = r.diaFin ? fecha(dia) + ' – ' + fecha(r.diaFin) : r.hora ? fecha(dia) + ' · ' + r.hora + '–' + r.fin : fecha(dia) + ' · todo el día';
    donde.innerHTML = `${NOMBRE[r.tipo] || 'Evento'} <b>${esc(r.titulo)}</b> · ${cuando}`;
  }

  // Simulacro: abre Claude con el examen ya explicado.
  function enlaceSimulacro(e) {
    const ex = D.examenes.find(x => x.tipo === 'examen' && x.asig === e.asig) || {};
    const temas = D.temario.filter(a => a.examen === ex.titulo).map(a => a.apartado + ' ' + a.titulo).join('; ');
    const texto = `Prepárame un simulacro de examen de ${e.asig} (${ex.titulo || 'próximo examen'}, ${ex.dia ? fecha(ex.dia) : ''}). ` +
      `Usa la skill estudiar-ingenieria y mis apuntes de CLAUDE ESTUDIO/QTARDOR 26-27. ` +
      (temas ? `Entra: ${temas}. ` : '') +
      `Que dure 90 minutos, sin formulario, con problemas al estilo de los de clase. Dame solo los enunciados; cuando te pase mis respuestas, corrígelas y ponme nota sobre 10.`;
    return 'https://claude.ai/new?q=' + encodeURIComponent(texto);
  }

  // ---------- Hojas ----------

  function abrirHoja(html, cual) {
    hoja = cual || 'otra';
    $('velo').innerHTML = `<div class="hoja ${hoja === 'foco' ? 'hoja-foco' : ''}" role="dialog" aria-modal="true">${html}</div>`;
    $('velo').hidden = false;
  }
  function cerrarHoja() {
    hoja = '';
    $('velo').hidden = true;
    $('velo').innerHTML = '';
    soltarPantalla();
  }

  function verEvento(e) {
    const cuando = e.todoDia
      ? fecha(e.dia) + (e.diaFin > e.dia ? ' – ' + fecha(e.diaFin) : ' · todo el día')
      : fecha(e.dia) + ' · ' + e.hora + '–' + e.horaFin;
    const estudio = e.tipo === 'estudio' && !e.todoDia;
    const k = esc(clave(e));
    abrirHoja(`<span class="eti"><i style="display:inline-block;width:8px;height:8px;border-radius:4px;background:${COLOR[e.tipo] || COLOR.evento};margin-right:6px"></i>${NOMBRE[e.tipo] || 'Evento'}${e.asig ? ' · ' + esc(e.asig) : ''}${e.tangerine ? ' · Tangerine' : ''}${e.atenea ? ' · Atenea' : ''}</span>
      <h3>${esc(e.titulo)}</h3>
      <p class="cuando">${cuando}${e.lugar ? ' · ' + esc(e.lugar) : ''}</p>
      ${estudio ? listaPasos(e, true) : e.desc ? `<p class="como">${esc(e.desc)}</p>` : ''}
      ${estudio && e.estado === 'hecha' ? `<p class="nota">✓ Hecha${e.nota ? ' · te fue ' + e.nota + '/5' : ''}${e.simulacro != null ? ' · simulacro ' + String(e.simulacro).replace('.', ',') + '/10' : ''}</p>` : ''}
      ${estudio && e.estado !== 'hecha' ? (esSimulacro(e)
        ? `<div class="fila"><a class="btn" style="flex:1" href="${esc(enlaceSimulacro(e))}" target="_blank" rel="noopener">Abrir en Claude</a><button class="btn sec" style="flex:1" data-act="notaSim" data-ev="${k}">Poner nota</button></div>`
        : `<div class="fila"><button class="btn" style="flex:1" data-act="foco" data-ev="${k}">Empezar</button><button class="btn sec" style="flex:1" data-act="terminar" data-ev="${k}">Hecha</button><button class="btn sec" style="flex:1" data-act="recolocar" data-ev="${k}">Muévela</button></div>`) : ''}
      ${estudio && e.estado === 'hecha' ? `<button class="btn sec" data-act="deshacer" data-ev="${k}">Marcar como pendiente</button>` : ''}
      ${e.tangerine ? `<a class="btn" href="${esc(D.tangerine)}" target="_blank" rel="noopener">Abrir Tangerine</a>` : ''}
      ${e.editable ? `<div class="fila">
          <button class="btn peligro" style="flex:1" data-act="borrar" data-ev="${k}">${e.serie ? 'Borrar solo este' : 'Borrar'}</button>
          ${e.serie ? `<button class="btn peligro" style="flex:1" data-act="borrar" data-serie="1" data-ev="${k}">Borrar toda la serie</button>` : ''}</div>` : ''}
      <button class="btn sec ancho" data-act="cerrar">Cerrar</button>`);
  }

  // ¿Qué tal ha ido? Antes de marcarla como hecha.
  function terminar(e) {
    abrirHoja(`<h3>¿Qué tal ha ido?</h3><p class="cuando">${esc(e.titulo)}</p>
      <div class="notas">${[1, 2, 3, 4, 5].map(n => `<button data-act="hechaNota" data-ev="${esc(clave(e))}" data-nota="${n}">${n}<small>${['Fatal', 'Mal', 'Regular', 'Bien', 'Genial'][n - 1]}</small></button>`).join('')}</div>
      <p class="nota">Con estas notas Claude ve qué temas cuestan más y los refuerza en el plan.</p>
      <button class="btn sec ancho" data-act="hechaNota" data-ev="${esc(clave(e))}" data-nota="0">Hecha, sin nota</button>`);
  }

  function notaSimulacro(e) {
    abrirHoja(`<form data-form="simulacro" data-ev="${esc(clave(e))}" style="display:contents">
      <h3>Nota del simulacro</h3><p class="cuando">${esc(e.titulo)}</p>
      <input class="campo" id="notaSim" inputmode="decimal" placeholder="Sobre 10, por ejemplo 6,5" autocomplete="off">
      <div class="fila"><button class="btn" style="flex:1">Guardar</button><button type="button" class="btn sec" data-act="cerrar">Cancelar</button></div></form>`);
    setTimeout(() => $('notaSim') && $('notaSim').focus(), 60);
  }

  // ---------- Foco: temporizador 50 + 10 con los pasos ----------

  let foco = null;   // { k, inicio, acumulado, pausa }
  try { foco = JSON.parse(localStorage.getItem('plum.foco') || 'null'); } catch (e) {}
  let faseAntes = '';
  let wake = null;

  function guardarFoco() { try { localStorage.setItem('plum.foco', JSON.stringify(foco)); } catch (e) {} }
  const transcurrido = () => !foco ? 0 : foco.acumulado + (foco.pausa ? 0 : Date.now() - foco.inicio);

  function abrirFoco(e) {
    if (!foco || foco.k !== clave(e)) {
      foco = { k: clave(e), inicio: Date.now(), acumulado: 0, pausa: false };
      guardarFoco();
    }
    abrirHoja('<div id="focoCuerpo"></div>', 'foco');
    pintarFoco();
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {}); } catch (err) {}
  }
  function soltarPantalla() { try { wake && wake.release(); } catch (e) {} wake = null; }

  function pintarFoco() {
    const cuerpo = $('focoCuerpo');
    if (!cuerpo || !foco) return;
    const e = buscar(foco.k);
    if (!e) { cerrarHoja(); return; }
    const t = transcurrido();
    const enCiclo = t % CICLO_MS;
    const descanso = enCiclo >= TRABAJO_MS;
    const queda = descanso ? CICLO_MS - enCiclo : TRABAJO_MS - enCiclo;
    const bloques = Math.max(1, Math.round(e.min / 60));
    const bloque = Math.min(bloques, Math.floor(t / CICLO_MS) + 1);
    const pasado = t >= e.min * 60000;
    const pct = descanso ? (enCiclo - TRABAJO_MS) / (CICLO_MS - TRABAJO_MS) : enCiclo / TRABAJO_MS;
    const mm = String(Math.floor(queda / 60000)).padStart(2, '0'), ss = String(Math.floor(queda / 1000) % 60).padStart(2, '0');
    const fase = pasado ? 'fin' : descanso ? 'descanso' : 'trabajo';
    if (faseAntes && fase !== faseAntes) pitar();
    faseAntes = fase;
    cuerpo.innerHTML = `<span class="eti">${pasado ? 'Tiempo cumplido' : descanso ? 'Descanso · 10 min' : 'Bloque ' + bloque + ' de ' + bloques + ' · 50 min'}</span>
      <h3>${esc(e.titulo)}</h3>
      <div class="reloj ${descanso ? 'descanso' : ''}" style="--p:${Math.round(pct * 100)}"><span><b>${pasado ? '✓' : mm + ':' + ss}</b><small>${foco.pausa ? 'en pausa' : descanso ? 'levántate y bebe agua' : 'sin móvil'}</small></span></div>
      ${listaPasos(e, true)}
      <div class="fila"><button class="btn sec" style="flex:1" data-act="pausa">${foco.pausa ? 'Seguir' : 'Pausa'}</button>
        <button class="btn" style="flex:1" data-act="terminar" data-ev="${esc(clave(e))}">Terminar</button></div>
      <button class="btn sec ancho" data-act="minimizar">Cerrar (sigue contando)</button>`;
  }

  // Un pitido corto al cambiar de fase (si el móvil deja sonar a la web).
  function pitar() {
    try {
      const ctx = pitar.ctx = pitar.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.value = .15;
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .35);
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  }

  // ---------- Tarjetas ----------

  let mazo = [];
  let vuelta = false;
  function abrirTarjetas(asig) {
    mazo = D.tarjetas.hoy.filter(t => !asig || t.asig === asig).slice();
    vuelta = false;
    abrirHoja('<div id="tarjetaCuerpo"></div>', 'tarjetas');
    pintarTarjeta();
  }
  function pintarTarjeta() {
    const c = $('tarjetaCuerpo');
    if (!c) return;
    if (!mazo.length) {
      c.innerHTML = `<h3>¡Hecho por hoy!</h3><p class="cuando">Las que fallaste vuelven mañana; las que sabías, más adelante.</p><button class="btn ancho" data-act="cerrar">Cerrar</button>`;
      return;
    }
    const t = mazo[0];
    c.innerHTML = `<span class="eti">${esc(t.asig)} · ${esc(t.tema)} · quedan ${mazo.length}</span>
      <button class="carta ${vuelta ? 'vuelta' : ''}" data-act="voltear"><span class="frente">${esc(t.frente)}</span>${vuelta ? `<span class="dorso">${esc(t.dorso)}</span>` : '<small>Piénsalo y toca para ver la respuesta</small>'}</button>
      ${vuelta ? `<div class="fila"><button class="btn sec" style="flex:1" data-act="respuesta" data-sabia="0">No la sabía</button><button class="btn" style="flex:1" data-act="respuesta" data-sabia="1">La sabía</button></div>` : ''}
      <button class="btn sec ancho" data-act="cerrar">Terminar por hoy</button>`;
  }

  // ---------- Conexiones ----------

  function conexiones() {
    const base = (D.exec || API || '') + '?k=' + encodeURIComponent(K);
    const copiar = (id, valor) => `<div class="copiar"><input class="campo" id="${id}" readonly value="${esc(valor)}"><button class="btn peq sec" data-act="copiar" data-id="${id}">Copiar</button></div>`;
    abrirHoja(`<h3>Conexiones</h3>
      <span class="eti">Atenea</span>
      <p class="nota">${D.atenea.conectado ? 'Conectada' + (D.atenea.ultima ? ' · última vez ' + new Date(D.atenea.ultima).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '') + '. Mira cada 6 horas si hay entregas nuevas.' : 'En Atenea: Calendari → Exporta el calendari → «Tots els esdeveniments» y «Esdeveniments recents i propers» → Obtén l\'URL del calendari. Pega aquí ese enlace.'}</p>
      <form data-form="atenea" style="display:contents"><input class="campo" id="ateneaUrl" placeholder="https://atenea.upc.edu/calendar/export_execute.php?…" autocomplete="off">
      <div class="fila"><button class="btn" style="flex:1">${D.atenea.conectado ? 'Cambiar enlace' : 'Conectar'}</button>${D.atenea.conectado ? '<button type="button" class="btn sec" style="flex:1" data-act="sincronizar">Mirar ahora</button>' : ''}</div></form>
      <span class="eti">Widget (app Scriptable)</span>
      <p class="nota">Instala Scriptable, abre este enlace en Safari, copia todo el texto en un script nuevo y añade un widget de Scriptable a la pantalla de inicio.</p>
      ${copiar('enlWidget', base + '&accion=scriptable')}
      <span class="eti">Avisos y Siri (app Dreceres)</span>
      <p class="nota">Crea un atajo con «Obtén el contingut de l'URL» y «Mostra la notificació». Para el aviso de las 6:00 y el repaso del domingo, ponlo en Automatització → Hora del dia.</p>
      <p class="nota"><b>Mañana a las 6:00 y «Oye Siri, ¿qué me toca?»</b></p>${copiar('enlHoy', base + '&accion=hoy')}
      <p class="nota"><b>Domingo a las 20:00: repaso de la semana</b></p>${copiar('enlSemana', base + '&accion=semana')}
      <button class="btn sec ancho" data-act="cerrar">Cerrar</button>`);
  }

  let modo = 'evento';
  let tipoMeta = 'examen';
  function nuevo(m) {
    modo = m || modo;
    const hoy = hoyLocal();
    const asigs = [...new Set(D.examenes.map(e => e.asig).concat(D.eventos.map(e => e.asig)).filter(Boolean))];
    const pestañas = [['evento', 'Evento'], ['viaje', 'Viaje'], ['examen', 'Examen'], ['tarea', 'Tarea']];
    let cuerpo = '';
    if (modo === 'evento') {
      cuerpo = `<input class="campo" id="nTexto" placeholder="«estudiar STE el sábado a las 5»" autocomplete="off">
        <p class="previa" id="nPrevia" style="margin:0"></p>
        <p class="nota">Escribe o dicta con el micro del teclado. Entiende el día, la hora, «@ lugar» y el tipo (estudiar, examen, cita…).</p>`;
    } else if (modo === 'viaje') {
      cuerpo = `<input class="campo" id="nTitulo" placeholder="Florencia, sortida del cau…" autocomplete="off">
        <div class="dos"><label>Ida<input class="campo" type="date" id="nDia" value="${hoy}"></label><label>Vuelta<input class="campo" type="date" id="nFin" value="${hoy}"></label></div>
        <p class="nota">Esos días no se te recolocará ninguna sesión de estudio.</p>`;
    } else if (modo === 'examen') {
      cuerpo = `<div class="chips">${[['examen', 'Examen'], ['entrega', 'Entrega']].map(([v, t]) => `<button type="button" data-act="tipoMeta" data-v="${v}" aria-pressed="${tipoMeta === v}">${t}</button>`).join('')}</div>
        <input class="campo" id="nTitulo" placeholder="${tipoMeta === 'examen' ? '1er control, final…' : 'Informe práctica 3…'}" autocomplete="off">
        <input class="campo" id="nAsig" placeholder="Asignatura (STE, MF, STM…)" list="asigs" autocomplete="off" autocapitalize="characters">
        <datalist id="asigs">${asigs.map(a => `<option value="${esc(a)}">`).join('')}</datalist>
        <div class="dos"><label>Día<input class="campo" type="date" id="nDia" value="${hoy}"></label><label>Hora (si la sabes)<input class="campo" type="time" id="nHora"></label></div>
        <p class="nota">Con la asignatura, Plum cuenta las horas de estudio que llevas para ${tipoMeta === 'examen' ? 'este examen' : 'esta entrega'}.</p>`;
    } else {
      cuerpo = `<input class="campo" id="nTexto" placeholder="«imprimir apuntes el lunes» o «cau comprar cartulinas»" autocomplete="off">
        <p class="previa" id="nPrevia" style="margin:0"></p>`;
    }
    abrirHoja(`<form data-form="nuevo" style="display:contents">
      <h3>Añadir</h3>
      <div class="chips">${pestañas.map(([v, t]) => `<button type="button" data-act="modo" data-v="${v}" aria-pressed="${modo === v}">${t}</button>`).join('')}</div>
      ${cuerpo}
      <div class="fila"><button class="btn" style="flex:1">Guardar</button><button type="button" class="btn sec" data-act="cerrar">Cancelar</button></div>
    </form>`);
    const t = $('nTexto');
    if (t) t.oninput = () => previa(t.value, $('nPrevia'), modo === 'tarea');
    const f = $('nTexto') || $('nTitulo');
    if (f) setTimeout(() => f.focus(), 60);
  }

  async function guardarNuevo(boton) {
    if (modo === 'evento' || modo === 'tarea') {
      const texto = $('nTexto').value.trim();
      if (!texto) return avisar('Escribe qué apuntar');
      const r = interpretar(texto, hoyLocal());
      if (modo === 'evento' && r.diaFin) {
        return hacer('evento', { titulo: r.titulo, tipo: r.tipo, dia: r.dia, diaFin: r.diaFin, todoDia: true, lugar: r.lugar }, boton);
      }
      return hacer('rapido', { texto, tarea: modo === 'tarea' }, boton);
    }
    const titulo = $('nTitulo').value.trim();
    if (!titulo) return avisar('Ponle un nombre');
    if (modo === 'viaje') {
      const dia = $('nDia').value, diaFin = $('nFin').value || dia;
      if (diaFin < dia) return avisar('La vuelta es antes de la ida');
      return hacer('evento', { titulo, tipo: 'viaje', dia, diaFin, todoDia: true }, boton);
    }
    const hora = $('nHora').value;
    const asig = $('nAsig').value.trim().toUpperCase();
    return hacer('evento', { titulo: asig && titulo.indexOf(asig) !== 0 ? asig + ' · ' + titulo : titulo, tipo: tipoMeta, asig, dia: $('nDia').value, hora, todoDia: !hora, min: tipoMeta === 'examen' ? 120 : 30 }, boton);
  }

  // ---------- Toques ----------

  document.addEventListener('click', e => {
    if (e.target === $('velo')) return hoja === 'foco' ? cerrarHoja() : cerrarHoja();
    const b = e.target.closest('[data-tab],[data-act]');
    if (!b) return;
    if (b.dataset.tab) {
      tab = b.dataset.tab;
      try { localStorage.setItem('plum.tab', tab); } catch (err) {}
      $('vista').scrollTop = 0;
      return pintar();
    }
    const a = b.dataset.act;
    const ev = b.dataset.ev ? buscar(b.dataset.ev) : null;
    if (a === 'reintentar') return cargar();
    if (a === 'cerrar') return cerrarHoja();
    if (a === 'ver' && ev) return verEvento(ev);
    if (a === 'foco' && ev) return abrirFoco(ev);
    if (a === 'terminar' && ev) return terminar(ev);
    if (a === 'hechaNota' && ev) {
      const n = Number(b.dataset.nota);
      if (foco && foco.k === clave(ev)) { foco = null; guardarFoco(); }
      return hacer('estado', Object.assign(ref(ev), { estado: 'hecha' }, n ? { nota: n } : {}), b);
    }
    if (a === 'notaSim' && ev) return notaSimulacro(ev);
    if (a === 'deshacer' && ev) return hacer('estado', Object.assign(ref(ev), { estado: '' }), b);
    if (a === 'recolocar' && ev) return hacer('recolocar', ref(ev), b);
    if (a === 'extra') return hacer('extra', { asig: b.dataset.asig, min: 60 }, b);
    if (a === 'paso' && ev) {
      const i = Number(b.dataset.i);
      const h = hechosDe(ev);
      ev.pasos = (h.includes(i) ? h.filter(x => x !== i) : h.concat(i).sort((x, y) => x - y)).join(',');
      refrescar();
      if (hoja === 'otra' && $('velo').querySelector('.pasos')) verEvento(ev);
      return silencioso('paso', Object.assign(ref(ev), { i }));
    }
    if (a === 'pausa' && foco) {
      if (foco.pausa) { foco.inicio = Date.now(); foco.pausa = false; } else { foco.acumulado = transcurrido(); foco.pausa = true; }
      guardarFoco();
      return pintarFoco();
    }
    if (a === 'minimizar') return cerrarHoja();
    if (a === 'borrar' && ev) {
      // Dos toques para borrar: el primero avisa.
      if (!b.classList.contains('seguro')) {
        b.classList.add('seguro');
        b.textContent = 'Toca otra vez para borrar';
        return;
      }
      return hacer('borrar', Object.assign(ref(ev), { serie: !!b.dataset.serie }), b);
    }
    if (a === 'abrir') { abierto = abierto === b.dataset.k ? '' : b.dataset.k; return pintar(); }
    if (a === 'apartado') {
      const ap = D.temario.find(x => x.id === b.dataset.id);
      if (!ap) return;
      ap.estado = SIGUIENTE_ESTADO[ap.estado || ''];
      pintar();
      return silencioso('apartado', { id: ap.id, estado: ap.estado });
    }
    if (a === 'habito') {
      const h = D.habitos.find(x => x.id === b.dataset.id);
      if (!h) return;
      h.hoy = !h.hoy;
      h.racha = Math.max(0, h.racha + (h.hoy ? 1 : -1));
      h.ultimos[13] = h.hoy;
      pintar();
      return silencioso('habito', { id: h.id, dia: hoyLocal() });
    }
    if (a === 'habitoBorrar') {
      if (!b.classList.contains('seguro')) { b.classList.add('seguro'); b.style.color = 'var(--exam)'; avisar('Toca otra vez la X para quitar el hábito'); return; }
      return hacer('habitoBorrar', { id: b.dataset.id }, b);
    }
    if (a === 'tarjetas') return abrirTarjetas(b.dataset.asig);
    if (a === 'voltear') { vuelta = !vuelta; return pintarTarjeta(); }
    if (a === 'respuesta') {
      const t = mazo.shift();
      const sabia = b.dataset.sabia === '1';
      if (!sabia) mazo.push(t);
      D.tarjetas.hoy = D.tarjetas.hoy.filter(x => x.id !== t.id || !sabia);
      vuelta = false;
      pintarTarjeta();
      return silencioso('tarjeta', { id: t.id, sabia });
    }
    if (a === 'conexiones') return conexiones();
    if (a === 'sincronizar') return hacer('atenea', {}, b);
    if (a === 'copiar') {
      const i = $(b.dataset.id);
      try { navigator.clipboard.writeText(i.value).then(() => avisar('Copiado'), () => { i.select(); }); } catch (err) { i.select(); }
      return;
    }
    if (a === 'nuevo') return nuevo(b.dataset.modo);
    if (a === 'modo') return nuevo(b.dataset.v);
    if (a === 'tipoMeta') { tipoMeta = b.dataset.v; return nuevo('examen'); }
    if (a === 'tarea') return hacer('hecha', { id: b.dataset.id }, b);
    if (a === 'borrarTarea') return hacer('borrarTarea', { id: b.dataset.id }, b);
  });

  $('mas').onclick = () => nuevo(tab === 'tasks' ? 'tarea' : tab === 'exams' ? 'examen' : 'evento');

  document.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target.dataset.form;
    const boton = e.target.querySelector('button:not([type=button])');
    if (f === 'rapido') {
      const texto = $('rapido').value.trim();
      if (texto) hacer('rapido', { texto }, boton);
    }
    if (f === 'tarea') {
      const texto = $('nuevaTarea').value.trim();
      if (texto) hacer('rapido', { texto, tarea: true }, boton);
    }
    if (f === 'habito') {
      const nombre = $('nuevoHabito').value.trim();
      if (nombre) hacer('habitoNuevo', { nombre }, boton);
    }
    if (f === 'simulacro') {
      const ev = buscar(e.target.dataset.ev);
      const nota = $('notaSim').value.trim().replace(',', '.');
      if (ev && nota) hacer('simulacro', Object.assign(ref(ev), { nota }), boton);
    }
    if (f === 'atenea') {
      const url = $('ateneaUrl').value.trim();
      if (url) hacer('atenea', { url }, boton);
    }
    if (f === 'nuevo') guardarNuevo(boton);
  });

  // Al volver a la app después de un rato, se refresca sola.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - cargadoEn > 60000) cargar();
  });
  // El reloj del foco cada segundo; Today cada minuto (sin molestar si estás escribiendo o con una hoja abierta).
  setInterval(() => { if (hoja === 'foco') pintarFoco(); }, 1000);
  setInterval(() => { if (D && document.visibilityState === 'visible' && tab === 'today' && !hoja && document.activeElement.tagName !== 'INPUT') pintar(); }, 60000);

  // Arranque: lo último guardado al momento y, detrás, lo de verdad.
  if (!EN_GOOGLE && (!API || !K)) {
    pantallaClave();
  } else {
    const cache = leerCache();
    if (cache && cache.semana) { D = cache; pintar(); }
    cargar();
  }
</script>
</body>
</html>
