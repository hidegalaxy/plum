<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plum">
<meta name="theme-color" content="#0c0c0d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icono-192.png">
<title>Plum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Oscura como Lima: poco por pantalla, mucho aire y un solo color fuerte (ciruela). */
  :root {
    color-scheme: dark;
    --bg: #0c0c0d;
    --surface: #161618;
    --line: #232327;
    --track: #2a2a2f;
    --text: #f4f4f2;
    --muted: #9a9aa1;
    --dim: #67676e;
    --plum: #c3a2ff;
    --ink: #0c0c0d;
    --exam: #ff6b5e;
    --due: #ffc247;
    --font: 'Space Grotesk', -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 var(--font); overscroll-behavior: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app { height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; position: relative; overflow: hidden; }

  header { display: flex; align-items: center; gap: 12px; padding: max(18px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 8px max(20px, env(safe-area-inset-left, 0px)); }
  header h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
  header span { color: var(--muted); font-size: 15px; flex: 1; padding-top: 6px; }
  .mas { width: 42px; height: 42px; border-radius: 14px; border: 0; background: var(--plum); color: var(--ink); display: grid; place-items: center; flex: 0 0 auto; }
  .carga { position: absolute; top: 0; left: 0; height: 2px; width: 0; background: var(--plum); z-index: 9; transition: width .3s, opacity .4s; opacity: 0; }
  .carga.ver { width: 70%; opacity: 1; transition: width 4s cubic-bezier(.1,.6,.3,1); }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; }
  .eti { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .vacio { color: var(--muted); margin: 0; }

  /* Today: lo que toca ahora */
  .ahora { background: var(--plum); color: var(--ink); border-radius: 26px; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; border: 0; text-align: left; width: 100%; }
  .ahora.otro { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .ahora .eti { color: rgba(12,12,13,.65); }
  .ahora.otro .eti { color: var(--muted); }
  .ahora h2 { margin: 0; font-size: 30px; letter-spacing: -.03em; line-height: 1.08; overflow-wrap: anywhere; }
  .ahora p { margin: 0; font-weight: 600; opacity: .75; }
  .ahora .como { font-weight: 500; opacity: .9; white-space: pre-line; line-height: 1.45; margin-top: 4px; }
  .ahora .fila { margin-top: 10px; flex-wrap: nowrap; }
  .ahora .fila .btn { flex: 1 1 auto; padding: 0 12px; min-width: 0; }
  .ahora .btn { background: var(--ink); color: var(--plum); }
  .ahora .btn.sec { border-color: rgba(12,12,13,.3); color: var(--ink); }
  .ahora.otro .btn { background: var(--plum); color: var(--ink); }
  .ahora.otro .btn.sec { border-color: var(--track); color: var(--text); }
  .despues { margin: -12px 0 0; color: var(--muted); font-size: 14px; padding-left: 4px; }

  .tip { border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
  .tip p { margin: 0; line-height: 1.5; }
  .tip b { color: var(--plum); font-weight: 600; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { height: 44px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--plum); color: var(--ink); font-weight: 700; }
  .btn.sec { background: none; border: 1px solid var(--track); color: var(--text); font-weight: 600; }
  .btn.peligro { background: none; border: 1px solid #5a2a27; color: var(--exam); font-weight: 600; }
  .btn.peligro.seguro { background: var(--exam); color: var(--ink); border-color: var(--exam); }
  .btn.ancho { width: 100%; height: 50px; }
  .btn:disabled { opacity: .5; }

  .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px 18px; text-align: left; width: 100%; }
  .meta .n { grid-row: span 2; font-size: 34px; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .meta .n small { font-size: 13px; letter-spacing: 0; font-weight: 600; color: var(--muted); margin-left: 3px; }
  .meta b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pastillas { display: flex; gap: 6px; flex-wrap: wrap; }
  .pastilla { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; max-width: 100%; }
  .pastilla i { width: 8px; height: 8px; border-radius: 4px; flex: 0 0 auto; }
  .pastilla span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .dia { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .dia li > button { display: grid; grid-template-columns: 50px 8px 1fr auto; align-items: center; gap: 12px; padding: 10px 0; width: 100%; background: none; border: 0; text-align: left; }
  .dia time { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
  .dia i { width: 8px; height: 8px; border-radius: 4px; }
  .dia b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .dia small { display: block; color: var(--dim); font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dia .pasado { opacity: .4; }
  .dia .estudio b { color: var(--plum); }
  .dia .ok { color: var(--plum); }
  .dia .linea { display: grid; grid-template-columns: 50px 1fr; align-items: center; gap: 12px; padding: 2px 0; color: var(--plum); font-size: 12px; font-weight: 700; }
  .dia .linea::after { content: ''; height: 2px; border-radius: 1px; background: var(--plum); }
  .compacta li > button { padding: 7px 0; }

  .rapido { display: flex; align-items: center; gap: 10px; border: 1px solid var(--track); border-radius: 18px; padding: 0 8px 0 16px; }
  .rapido input { flex: 1; min-width: 0; height: 52px; border: 0; background: none; outline: none; font-size: 16px; }
  .rapido input::placeholder { color: var(--dim); }
  .rapido button { width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--track); display: grid; place-items: center; color: var(--plum); flex: 0 0 auto; }
  .previa { font-size: 13px; color: var(--muted); margin: -14px 0 0 6px; min-height: 18px; }
  .previa b { color: var(--plum); font-weight: 600; }

  /* Exams */
  .examenes { display: flex; flex-direction: column; gap: 10px; }
  .ex { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; width: 100%; text-align: left; }
  .ex .n { grid-row: span 3; font-size: 38px; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .ex .n small { display: block; font-size: 12px; letter-spacing: 0; font-weight: 600; color: var(--muted); margin-top: 4px; }
  .ex b { font-weight: 600; min-width: 0; }
  .ex .cuando { font-size: 13px; color: var(--muted); }
  .asig { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--track); color: var(--text); margin-right: 6px; vertical-align: 2px; }
  .barra { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px; }
  .barra span { flex: 1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .barra em { display: block; height: 100%; border-radius: 3px; background: var(--plum); }
  .ex .prox { grid-column: 2; font-size: 13px; opacity: .85; }
  .ex .prox.falta { color: var(--due); }
  .sesiones { grid-column: 1 / -1; list-style: none; margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .sesiones li { display: grid; grid-template-columns: 14px 118px 1fr; gap: 8px; align-items: baseline; }
  .sesiones li span { white-space: nowrap; }
  .sesiones li span { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sesiones .si { color: var(--plum); }
  .sesiones .no { color: var(--due); }
  .sesiones em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Tasks */
  .grupo { display: flex; flex-direction: column; gap: 2px; }
  .tarea { display: flex; align-items: center; gap: 4px; }
  .tarea > button:first-child { flex: 1; display: flex; align-items: center; gap: 14px; padding: 10px 0; text-align: left; background: none; border: 0; min-width: 0; }
  .tarea .c { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 13px; border: 2px solid var(--track); display: grid; place-items: center; color: var(--ink); }
  .tarea.ok .c { background: var(--plum); border-color: var(--plum); }
  .tarea.ok b { color: var(--dim); text-decoration: line-through; }
  .tarea b { font-weight: 500; }
  .tarea small { display: block; color: var(--muted); font-size: 12px; }
  .tarea small.vencida { color: var(--exam); }
  .quitar { width: 36px; height: 36px; border: 0; background: none; color: var(--dim); border-radius: 10px; display: grid; place-items: center; }

  nav { display: flex; border-top: 1px solid var(--line); padding: 4px max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  nav button { flex: 1; border: 0; background: none; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 4px; font-size: 11px; font-weight: 600; }
  nav button[aria-current] { color: var(--plum); }

  /* Hojas que suben desde abajo */
  .velo { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; z-index: 5; }
  .hoja { width: 100%; background: var(--surface); border-radius: 28px 28px 0 0; border-top: 1px solid var(--track); padding: 20px 20px max(24px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow-y: auto; animation: sube .25s ease; }
  @keyframes sube { from { transform: translateY(30px); opacity: .5; } }
  .hoja h3 { margin: 0; font-size: 22px; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .hoja .cuando { color: var(--muted); margin: -8px 0 0; }
  .hoja .como { margin: 0; white-space: pre-line; line-height: 1.5; background: var(--bg); border-radius: 14px; padding: 12px 14px; }
  .campo { width: 100%; height: 48px; border: 1px solid var(--track); background: var(--bg); border-radius: 14px; padding: 0 14px; outline: none; }
  .campo:focus { border-color: var(--plum); }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dos label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--track); background: none; font-weight: 600; font-size: 14px; }
  .chips button[aria-pressed="true"] { background: var(--text); color: var(--ink); border-color: var(--text); }
  .nota { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }

  .toast { position: absolute; left: 16px; right: 16px; bottom: 84px; background: var(--text); color: var(--ink); padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; opacity: 0; transform: translateY(8px); transition: .25s; pointer-events: none; z-index: 8; }
  .toast.ver { opacity: 1; transform: none; }

  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .btn.peq { height: 34px; padding: 0 12px; border-radius: 11px; font-size: 13px; flex: 0 0 auto; }

  /* Pasos de una sesión para ir tachando */
  .pasos { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .pasos button { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; padding: 5px 0; font-weight: 500; line-height: 1.4; }
  .pasos i { width: 20px; height: 20px; flex: 0 0 20px; border-radius: 7px; border: 2px solid currentColor; opacity: .55; display: grid; place-items: center; margin-top: 1px; }
  .pasos .ok i { opacity: 1; background: currentColor; }
  .pasos .ok i svg { color: var(--plum); }
  .ahora.otro .pasos .ok i svg, .hoja .pasos .ok i svg { color: var(--ink); }
  .hoja .pasos .ok i { background: var(--plum); border-color: var(--plum); }
  .pasos .ok span { text-decoration: line-through; opacity: .6; }
  .pasos button:disabled { cursor: default; }

  .meta-grupo { display: flex; flex-direction: column; gap: 0; }
  .meta-grupo .meta:has(+ .atraso) { border-radius: 22px 22px 0 0; }
  .atraso { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 10px 14px 10px 18px; border: 1px solid #4a3a16; border-top: 0; border-radius: 0 0 22px 22px; background: #1d1910; color: var(--due); font-size: 14px; }
  .ex .atraso { grid-column: 1 / -1; border: 1px solid #4a3a16; border-radius: 14px; margin-top: 8px; }
  .atraso b { font-weight: 700; }
  .atraso .btn { background: var(--due); color: var(--ink); }

  /* Hábitos de hoy */
  .habitos { display: flex; gap: 8px; flex-wrap: wrap; }
  .habito { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px 6px 8px; border-radius: 14px; border: 1px solid var(--track); background: none; font-size: 14px; font-weight: 600; text-align: left; }
  .habito i { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--track); display: grid; place-items: center; color: var(--ink); flex: 0 0 auto; }
  .habito.ok { border-color: var(--plum); }
  .habito.ok i { background: var(--plum); border-color: var(--plum); }
  .habito small { color: var(--plum); font-size: 11px; font-weight: 700; }

  .tarjetas-btn .n { font-size: 30px; }

  /* Exams: la tarjeta tiene cabecera tocable y, abierta, el temario y las sesiones */
  .ex { display: flex; flex-direction: column; gap: 4px; }
  .ex-cab { display: grid; grid-template-columns: 58px 1fr; gap: 4px 14px; width: 100%; text-align: left; background: none; border: 0; padding: 0; }
  .ex-cab .n { grid-row: span 3; font-size: 38px; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .ex-cab .n small { display: block; font-size: 12px; letter-spacing: 0; font-weight: 600; color: var(--muted); margin-top: 4px; }
  .ex-cab b { font-weight: 600; min-width: 0; }
  .ex-cab .cuando { font-size: 13px; color: var(--muted); }
  .ex-cab .prox { grid-column: 2; font-size: 13px; opacity: .85; }
  .ex-cab .prox.falta { color: var(--due); }
  .bloque { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; margin-top: 8px; border-top: 1px solid var(--line); }
  .ex .bloque .sesiones { border: 0; margin: 0; padding: 0; }
  .temario { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .temario button { display: grid; grid-template-columns: 14px 34px 1fr; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 7px 0; font-size: 14px; }
  .temario i { width: 14px; height: 14px; border-radius: 7px; transition: background .2s; }
  .temario .num { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; font-size: 13px; }
  .ex .como { margin: 6px 0 0; white-space: pre-line; color: var(--muted); font-size: 14px; }

  /* Week */
  .resumen { display: flex; gap: 20px; align-items: center; }
  .aro { --p: 0; width: 118px; height: 118px; flex: 0 0 118px; border-radius: 50%; background: conic-gradient(var(--plum) calc(var(--p) * 1%), var(--track) 0); display: grid; place-items: center; }
  .aro > span { width: 96px; height: 96px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; text-align: center; align-content: center; }
  .aro b { font-size: 28px; letter-spacing: -.03em; display: block; line-height: 1; }
  .aro small { font-size: 11px; color: var(--muted); font-weight: 600; }
  .cifras { display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: var(--muted); min-width: 0; }
  .cifras b { color: var(--text); }
  .fila-asig { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 10px; }
  .fila-asig .barra { margin: 0; }
  .fila-sin, .fila-hab { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 6px 0; }
  .fila-sin > span, .fila-hab > span:first-child { min-width: 0; flex: 1; }
  .fila-sin b, .fila-hab b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila-sin small, .fila-hab small { color: var(--muted); font-size: 12px; }
  .puntos { display: grid; grid-template-columns: repeat(14, 7px); gap: 3px; flex: 0 0 auto; }
  .puntos i { width: 7px; height: 14px; border-radius: 3px; background: var(--track); }
  .puntos i.si { background: var(--plum); }
  .puntos i.hoy { outline: 1px solid var(--muted); outline-offset: 1px; }
  .grupo.cau .eti { color: #3fd69b; }

  /* Foco */
  .hoja-foco { gap: 16px; }
  #focoCuerpo, #tarjetaCuerpo { display: flex; flex-direction: column; gap: 14px; }
  .reloj { --p: 0; align-self: center; width: 210px; height: 210px; border-radius: 50%; background: conic-gradient(var(--plum) calc(var(--p) * 1%), var(--track) 0); display: grid; place-items: center; }
  .reloj.descanso { background: conic-gradient(#3fd69b calc(var(--p) * 1%), var(--track) 0); }
  .reloj > span { width: 184px; height: 184px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; align-content: center; text-align: center; gap: 4px; }
  .reloj b { font-size: 52px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; }
  .reloj small { color: var(--muted); font-size: 13px; font-weight: 600; }

  /* Nota de la sesión */
  .notas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .notas button { height: 70px; border-radius: 14px; border: 1px solid var(--track); background: var(--bg); font-size: 24px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .notas button small { font-size: 10px; color: var(--muted); font-weight: 600; }
  .notas button:active { background: var(--plum); color: var(--ink); }

  /* Tarjetas */
  .carta { min-height: 230px; border-radius: 22px; border: 1px solid var(--track); background: var(--bg); padding: 22px; display: flex; flex-direction: column; justify-content: center; gap: 16px; text-align: left; width: 100%; }
  .carta .frente { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .carta .dorso { font-size: 17px; line-height: 1.5; color: var(--plum); font-weight: 500; }
  .carta small { color: var(--dim); font-size: 13px; }
  .carta.vuelta { border-color: var(--plum); }

  .copiar { display: flex; gap: 8px; align-items: center; }
  .copiar .campo { height: 40px; font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-k="<?= clave ?>">
<div class="app">
  <div class="carga" id="carga"></div>
  <header><h1 id="titulo">Plum</h1><span id="sub"></span>
    <button class="mas" id="mas" aria-label="Añadir"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></header>
  <main id="vista"><p class="vacio">Cargando…</p></main>
